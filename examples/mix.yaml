sample_rate: 48000
output_channels: 2
headroom_db: -6.0

master:
  preset: streaming
  target_lufs: -14.0
  ceiling_db: -1.0
  highpass_hz: 30.0
  stereo_width: 1.05
  eq:
    - type: low_shelf
      frequency_hz: 120
      gain_db: 0.8
      q: 0.707
    - type: bell
      frequency_hz: 3200
      gain_db: 1.2
      q: 1.1
  effects:
    - type: pedalboard.Reverb
      room_size: 0.08
      wet_level: 0.05
      dry_level: 0.95
  compressor:
    threshold_db: -18.0
    ratio: 2.0
    attack_ms: 20.0
    release_ms: 160.0
    makeup_gain_db: 0.0
  limiter:
    ceiling_db: -1.0
    lookahead_ms: 5.0
    release_ms: 80.0
    oversample_factor: 4

stems:
  - path: ../audio/drums.wav
    gain_db: -3.0
    pan: 0.0
    fade_in: 0.02
    fade_out: 0.10
    highpass_hz: 35.0
    compressor:
      threshold_db: -16.0
      ratio: 2.5
      attack_ms: 10.0
      release_ms: 120.0
  - path: ../audio/bass.wav
    gain_db: -4.0
    pan: 0.0
    eq:
      - type: bell
        frequency_hz: 90
        gain_db: 1.0
        q: 1.0
  - path: ../audio/vocal.wav
    gain_db: 1.5
    pan: 0.0
    highpass_hz: 80.0
    eq:
      - type: bell
        frequency_hz: 3500
        gain_db: 1.5
        q: 1.0
    effects:
      - type: pedalboard.Delay
        delay_seconds: 0.18
        mix: 0.08
