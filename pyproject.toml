[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "master-cli"
version = "0.1.0"
description = "A Python CLI stack for mixing and mastering audio files."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "master-cli contributors" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
pedalboard = [
  "pedalboard>=0.9.23",
]

[project.scripts]
master-cli = "master_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
